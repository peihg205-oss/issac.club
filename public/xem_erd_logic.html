  <script>
    var currentTab = 'core';
    var scale = 1.0;
    var viewport = document.getElementById('viewport');

    var fileMap = {
      'core': { png: 'issac_erd_core.png', svg: 'issac_erd_core.svg', defaultScale: 0.95 },
      'act': { png: 'issac_erd_activities.png', svg: 'issac_erd_activities.svg', defaultScale: 0.95 },
      'ledger': { png: 'issac_erd_ledger.png', svg: 'issac_erd_ledger.svg', defaultScale: 0.95 },
      'disc': { png: 'issac_erd_discipline.png', svg: 'issac_erd_discipline.svg', defaultScale: 0.95 },
      'full': { png: 'issac_erd_diagram.png', svg: 'issac_erd_diagram.svg', defaultScale: 0.55 }
    };

    function switchTab(tabKey) {
      currentTab = tabKey;
      
      // Update buttons
      var buttons = document.querySelectorAll('#tabContainer .tab-btn');
      var keys = ['core', 'act', 'ledger', 'disc', 'full'];
      buttons.forEach(function(btn, idx) {
        if (keys[idx] === tabKey) {
          btn.className = 'tab-btn active';
        } else {
          btn.className = 'tab-btn';
        }
      });

      // Update views
      keys.forEach(function(k) {
        var el = document.getElementById('view-' + k);
        if (k === tabKey) {
          el.className = 'diagram-view active';
        } else {
          el.className = 'diagram-view';
        }
      });

      // Update download links
      document.getElementById('downloadPngBtn').href = fileMap[tabKey].png;
      document.getElementById('downloadPngBtn').download = fileMap[tabKey].png;
      document.getElementById('downloadSvgBtn').href = fileMap[tabKey].svg;
      document.getElementById('downloadSvgBtn').download = fileMap[tabKey].svg;

      scale = fileMap[tabKey].defaultScale;
      applyZoom();
      viewport.scrollLeft = 0;
      viewport.scrollTop = 0;
    }

    function zoom(factor) {
      scale = scale * factor;
      if (scale < 0.15) scale = 0.15;
      if (scale > 3.0) scale = 3.0;
      applyZoom();
    }

    function resetZoom() {
      scale = fileMap[currentTab].defaultScale;
      applyZoom();
      viewport.scrollLeft = 0;
      viewport.scrollTop = 0;
    }

    function applyZoom() {
      var activeEl = document.getElementById('view-' + currentTab);
      if (activeEl) {
        activeEl.style.transform = 'scale(' + scale + ')';
      }
    }

    window.addEventListener('load', function() {
      resetZoom();
    });

    viewport.addEventListener('wheel', function(e) {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        zoom(e.deltaY < 0 ? 1.1 : 0.9);
      }
    }, { passive: false });
  </script>
